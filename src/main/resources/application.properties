quarkus.application.name=chat-app

quarkus.http.port=8090

# --- Default datasource (required for casehub-ledger library beans injecting @Default EntityManager) ---
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:chat-app;DB_CLOSE_DELAY=-1
quarkus.datasource.reactive=false

# --- Default Hibernate PU (no entities — satisfies @Default EntityManager) ---
quarkus.hibernate-orm.packages=io.casehub.chat.app
quarkus.hibernate-orm.database.generation=none

# --- Named qhorus datasource (qhorus PU config comes from qhorus-runtime's application.properties) ---
quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:chat-app;DB_CLOSE_DELAY=-1
quarkus.datasource.qhorus.reactive=false

# --- Flyway seed data (appends to qhorus-runtime's migration locations) ---
quarkus.flyway.qhorus.locations=classpath:db/qhorus/migration,classpath:db/ledger/migration,classpath:db/chatapp/seed
quarkus.hibernate-orm.qhorus.database.generation=none

# --- Exclude qhorus CurrentPrincipal (chat-app provides its own via pages-auth JWT) ---
quarkus.arc.exclude-types=io.casehub.qhorus.runtime.identity.QhorusInboundCurrentPrincipal

# --- Ledger disabled (no audit trail needed for embedded chat-app) ---
casehub.ledger.enabled=false
casehub.ledger.hash-chain.enabled=false

# --- Frontend ---
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=22.16.0
quarkus.quinoa.enable-spa-routing=true

# --- SmallRye JWT ---
smallrye.jwt.new-token.issuer=casehub-dev
mp.jwt.verify.issuer=casehub-dev
casehub.pages.auth.default-tenant=chat-app

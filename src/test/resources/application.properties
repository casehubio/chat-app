# Test configuration — H2 in-memory, drop-and-create (no Flyway in tests)

# Default datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.reactive=false

# Default PU — no entities
quarkus.hibernate-orm.packages=io.casehub.chat.app
quarkus.hibernate-orm.database.generation=none

# Qhorus datasource
%test.quarkus.datasource.qhorus.db-kind=h2
%test.quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.qhorus.reactive=false

# Qhorus PU — drop-and-create for fast tests (no Flyway)
quarkus.hibernate-orm.qhorus.database.generation=drop-and-create
quarkus.flyway.qhorus.migrate-at-start=false

# Ledger disabled
casehub.ledger.enabled=false
casehub.ledger.hash-chain.enabled=false

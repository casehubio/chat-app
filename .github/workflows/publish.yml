name: Build and Publish

on:
  repository_dispatch:
    types: [upstream-published]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Published blocks-ui 0.3 requires this parent, absent from GitHub Packages.
      - name: Check out CaseHub parent 0.3
        uses: actions/checkout@v4
        with:
          repository: casehubio/parent
          ref: a5766dfb227917c72ba681dc2971b780fd1fab00 # v0.3
          path: .ci/casehub-parent

      - name: Install CaseHub parent 0.3
        run: mvn --batch-mode -N -f .ci/casehub-parent/pom.xml install

      - name: Build and test
        run: mvn --batch-mode -U verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chat app
        run: |
          cd target
          zip -qr "$GITHUB_WORKSPACE/casehub-chat-app-0.3.zip" quarkus-app

      - name: Upload chat app
        uses: actions/upload-artifact@v4
        with:
          name: casehub-chat-app-0.3
          path: casehub-chat-app-0.3.zip
          if-no-files-found: error
